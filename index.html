<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Tratta</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<style>
html,body{margin:0;height:100%;background:#0b0e14;overflow:hidden;color:#eef3fa;font-family:"Segoe UI",system-ui,sans-serif}
canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none}
.panelWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,7,12,.72);pointer-events:auto}
.hidden{display:none!important}
.panel{max-width:560px;width:90%;background:rgba(14,18,28,.92);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:22px 24px;max-height:88vh;overflow:auto}
h1{margin:0 0 8px;font-size:30px;letter-spacing:1px}h2{margin:0 0 6px;color:#ffb23e;font-size:14px;letter-spacing:2px;text-transform:uppercase}
p{line-height:1.5;opacity:.92}
button{font:inherit;color:inherit;cursor:pointer}
.go{background:linear-gradient(#ff8a1f,#e5590b);border:0;border-radius:10px;padding:12px 22px;font-weight:700;font-size:17px;margin:6px 6px 0 0}
.choice{display:block;width:100%;text-align:left;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 12px;margin:6px 0}
.choice.active{border-color:#ff8a1f;background:rgba(255,138,31,.14)}.choice.locked{opacity:.4;pointer-events:none}
.choice span{display:block;font-size:13px;opacity:.75}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .choice{flex:1;min-width:120px}
#hud{position:absolute;left:18px;bottom:96px;text-shadow:0 2px 6px #000}
#speed{font-size:56px;font-weight:800;line-height:.9}#speed span{font-size:14px;opacity:.7;margin-left:6px}
#bar{width:200px;height:8px;background:rgba(255,255,255,.15);border-radius:4px;margin-top:8px;overflow:hidden}#hp{height:100%;background:#4cd964;width:100%}
#obj{position:absolute;left:18px;top:14px;max-width:420px;background:rgba(6,8,14,.55);padding:8px 12px;border-radius:10px;font-size:14px}
#heat{position:absolute;right:18px;top:14px;font-size:26px;letter-spacing:3px;text-shadow:0 2px 6px #000}
#msg{position:absolute;top:30%;width:100%;text-align:center;font-size:30px;font-weight:800;text-shadow:0 3px 10px #000;opacity:0;transition:opacity .3s}
#touch{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:space-between;padding:0 12px}
#touch button{pointer-events:auto;width:84px;height:64px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(8,12,18,.6);font-size:18px;font-weight:700}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="ui">
  <div id="obj" class="hidden"></div><div id="heat" class="hidden"></div><div id="msg"></div>
  <div id="hud"><div id="speed">0<span>km/h</span></div><div id="meta"></div><div id="bar" class="hidden"><div id="hp"></div></div></div>
  <div id="touch"><div><button id="tL">◀</button> <button id="tR">▶</button></div><div><button id="tB">FRENO</button> <button id="tG">GAS</button></div></div>
  <div id="menu" class="panelWrap hidden" style="z-index:40"><div class="panel">
    <h1>Garage</h1>
    <h2>Mezzo</h2><div class="row"><button class="choice active" data-car="0"><b>Berlina GT</b><span>Stabile, regge gli urti.</span></button><button class="choice" data-car="1"><b>Coupé R</b><span>Più veloce, più fragile.</span></button></div>
    <h2>Grafica</h2><div class="row"><button class="choice" data-q="2">Alta</button><button class="choice" data-q="1">Media</button><button class="choice" data-q="0">Bassa</button></div>
    <button class="go" id="menuClose">Chiudi</button><p style="font-size:13px;opacity:.6">Frecce/A-D sterzo · W/↑ gas · S/↓ freno · Spazio nitro</p>
  </div></div>
  <div id="intro" class="panelWrap hidden"><div class="panel"><h2 id="inCh"></h2><h1 id="inT"></h1><p id="inTx"></p><p id="inGoal" style="color:#ffb23e"></p><button class="go" id="inGo">Parti</button></div></div>
  <div id="over" class="panelWrap hidden"><div class="panel"><h1 id="ovT"></h1><p id="ovTx"></p><button class="go" id="ovRetry">Riprova</button><button class="go" id="ovMenu" style="background:#334">Menu</button></div></div>
</div>
<script type="module" src="./game.js"></script>
</body>
</html>
